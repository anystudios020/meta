
name: Build and Validate METAPHYSICAL VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out METAPHYSICAL
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure METAPHYSICAL
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF

      - name: Build METAPHYSICAL VST3
        run: cmake --build build --config Release --target METAPHYSICAL_VST3 -j 3

      - name: Fix metadata and sign plugin
        env:
          PLUGIN_PATH: build/METAPHYSICAL_artefacts/Release/VST3/METAPHYSICAL.vst3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import os

          p = Path(os.environ["PLUGIN_PATH"]) / "Contents/Resources/moduleinfo.json"
          data = p.read_text()
          data = re.sub(r",(\s*[}\]])", r"\1", data)
          parsed = json.loads(data)
          p.write_text(json.dumps(parsed, indent=2) + "\n")
          print("VST3 metadata validated and corrected.")
          PY

          codesign --force --deep --sign - --timestamp=none "$PLUGIN_PATH"
          codesign --verify --deep --strict "$PLUGIN_PATH"

      - name: Download Steinberg VST3 SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git vst3sdk

      - name: Configure Steinberg validator
        run: |
          cmake -S vst3sdk -B vst3sdk/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON

      - name: Build Steinberg validator
        run: |
          cmake --build vst3sdk/build --config Release --target validator -j 3

      - name: Validate METAPHYSICAL
        env:
          PLUGIN_PATH: build/METAPHYSICAL_artefacts/Release/VST3/METAPHYSICAL.vst3
        run: |
          VALIDATOR="$(find vst3sdk/build -type f -name validator -perm -111 -print -quit)"

          if [ -z "$VALIDATOR" ]; then
            echo "ERROR: Steinberg validator executable not found."
            exit 1
          fi

          echo "Running Steinberg VST3 validation..."
          "$VALIDATOR" "$PLUGIN_PATH"

      - name: Package DMG
        run: |
          mkdir -p package
          cp -R build/METAPHYSICAL_artefacts/Release/VST3/METAPHYSICAL.vst3 package/
          hdiutil create -volname METAPHYSICAL -srcfolder package -ov -format UDZO METAPHYSICAL-macOS.dmg

      - name: Upload plugin and installer
        uses: actions/upload-artifact@v4
        with:
          name: METAPHYSICAL-macOS
          path: |
            METAPHYSICAL-macOS.dmg
            package/METAPHYSICAL.vst3
